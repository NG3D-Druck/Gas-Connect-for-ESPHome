substitutions:
  name: gas-connect
  friendly_name: Gas Connect for ESPHome
  # Used for the daily/monthly/yearly consumption rollover at local midnight,
  # until Home Assistant provides its own timezone
  timezone: Europe/Berlin

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true
  on_boot:
    # Run after all components (incl. restored globals) are set up
    priority: -100
    then:
      - lambda: |-
          id(gas_pulse_meter).set_total_pulses(id(gas_total_pulses));
          id(gas_pulse_meter).set_filter_us(id(reed_debounce).state * 1000);
          id(gas_total_restored) = true;

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# To be able to get logs from the device via serial and api.
logger:

# API is a requirement of the dashboard import.
api:

# OTA is required for Over-the-Air updating
ota:
  - platform: esphome

wifi:
  # Set up a wifi access point using the device name above
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

globals:
  # Meter reading in pulses, persisted across reboots
  - id: gas_total_pulses
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Guards gas_total_pulses until it has been restored on boot
  - id: gas_total_restored
    type: bool
    restore_value: false
    initial_value: "false"
  # Volume per pulse in m³, set via the "Pulse volume" select
  - id: gas_pulse_volume
    type: double
    restore_value: true
    initial_value: "0.01"
  # Meter reading in pulses at the start of the current day/month/year and
  # the period it belongs to (0 = not set yet, waiting for the first time sync)
  - id: gas_day_base
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: gas_day_key
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: gas_month_base
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: gas_month_key
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: gas_year_base
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: gas_year_key
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Consumption of the previous day in m³
  - id: gas_yesterday
    type: float
    restore_value: true
    initial_value: "NAN"
  # True while the LED briefly flashes for a pulse
  - id: led_flash
    type: bool
    restore_value: false
    initial_value: "false"

time:
  # Without a timezone of its own, this takes over the timezone set in
  # Home Assistant (2026.3.0 and newer) once the API is connected.
  # Listed first, so the sntp timezone below is the default until then.
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - script.execute: gas_period_rollover
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute: gas_period_rollover

interval:
  - interval: 60s
    then:
      - script.execute: gas_period_rollover
  - interval: 500ms
    then:
      - script.execute: led_refresh

script:
  # Starts a new day/month/year once the local date has changed
  - id: gas_period_rollover
    then:
      - lambda: |-
          if (!id(gas_total_restored)) return;
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;
          const uint32_t pulses = id(gas_total_pulses);

          const uint32_t day = now.year * 1000 + now.day_of_year;
          if (id(gas_day_key) != day) {
            const uint32_t last = id(gas_day_key);
            const bool consecutive = last + 1 == day ||
                (now.day_of_year == 1 && last / 1000 + 1 == now.year && last % 1000 >= 365);
            // Unknown if the device was off for a whole day
            id(gas_yesterday) = consecutive ? (pulses - id(gas_day_base)) * id(gas_pulse_volume) : NAN;
            id(gas_day_base) = pulses;
            id(gas_day_key) = day;
          }

          const uint32_t month = now.year * 100 + now.month;
          if (id(gas_month_key) != month) {
            id(gas_month_base) = pulses;
            id(gas_month_key) = month;
          }

          if (id(gas_year_key) != now.year) {
            id(gas_year_base) = pulses;
            id(gas_year_key) = now.year;
          }

  # Shows the device status on the LED, see the "LED mode" select:
  # blue blinking = no Wi-Fi, yellow blinking = no Home Assistant connection,
  # green flash = pulse, off = all fine
  - id: led_refresh
    then:
      - lambda: |-
          // The LED strip has no buffer before its setup; restoring the
          // "LED mode" select during setup would otherwise write to it
          if (!id(gas_total_restored)) return;
          const auto index = id(led_mode_select).active_index();
          const size_t mode = index.has_value() ? *index : 0;  // 0 = status + pulse, 1 = status only, 2 = off
          const bool blink_on = (millis() / 1000) % 2 == 0;
          float r = 0, g = 0, b = 0;
          if (mode != 2) {
            if (!wifi::global_wifi_component->is_connected()) {
              if (blink_on) b = 1;
            } else if (!api::global_api_server->is_connected()) {
              if (blink_on) { r = 1; g = 0.5; }
            } else if (mode == 0 && id(led_flash)) {
              g = 1;
            }
          }
          // Only touch the light on changes, to keep the log quiet
          static float last_r = -1, last_g = -1, last_b = -1;
          if (r == last_r && g == last_g && b == last_b) return;
          last_r = r;
          last_g = g;
          last_b = b;
          if (r == 0 && g == 0 && b == 0) {
            auto call = id(onboard_led).turn_off();
            call.set_transition_length(0);
            call.perform();
          } else {
            auto call = id(onboard_led).turn_on();
            call.set_rgb(r, g, b);
            call.set_brightness(0.5);
            call.set_transition_length(0);
            call.perform();
          }

sensor:
  # Reed contact on GPIO4 against GND
  - platform: pulse_meter
    id: gas_pulse_meter
    name: Gas flow
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
      allow_other_uses: true
    # Ignore contact bounces shorter than this; set at runtime by "Debounce time"
    internal_filter: 100ms
    internal_filter_mode: PULSE
    timeout: 10min
    unit_of_measurement: "m³/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 3
    icon: mdi:meter-gas
    filters:
      # pulses/min -> m³/h
      - lambda: return x * id(gas_pulse_volume) * 60.0f;
    total:
      id: gas_meter_reading
      name: Gas meter reading
      unit_of_measurement: "m³"
      device_class: gas
      state_class: total_increasing
      accuracy_decimals: 2
      icon: mdi:meter-gas
      filters:
        - lambda: return x * id(gas_pulse_volume);
      on_raw_value:
        - lambda: |-
            if (id(gas_total_restored)) {
              id(gas_total_pulses) = (uint32_t) x;
            }

  - platform: template
    id: gas_today
    name: Gas today
    unit_of_measurement: "m³"
    device_class: gas
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:calendar-today
    update_interval: 60s
    lambda: |-
      if (id(gas_day_key) == 0) return NAN;
      return (uint32_t) (id(gas_total_pulses) - id(gas_day_base)) * id(gas_pulse_volume);

  - platform: template
    id: gas_yesterday_sensor
    name: Gas yesterday
    unit_of_measurement: "m³"
    device_class: gas
    accuracy_decimals: 2
    icon: mdi:calendar-arrow-left
    update_interval: 60s
    lambda: return id(gas_yesterday);

  - platform: template
    id: gas_this_month
    name: Gas this month
    unit_of_measurement: "m³"
    device_class: gas
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:calendar-month
    update_interval: 60s
    lambda: |-
      if (id(gas_month_key) == 0) return NAN;
      return (uint32_t) (id(gas_total_pulses) - id(gas_month_base)) * id(gas_pulse_volume);

  - platform: template
    id: gas_this_year
    name: Gas this year
    unit_of_measurement: "m³"
    device_class: gas
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:calendar-blank
    update_interval: 60s
    lambda: |-
      if (id(gas_year_key) == 0) return NAN;
      return (uint32_t) (id(gas_total_pulses) - id(gas_year_base)) * id(gas_pulse_volume);

  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  # Uptime as e.g. "2d 3h 15m"; updated every minute, so without seconds
  - platform: uptime
    id: uptime_sensor
    name: Uptime
    entity_category: diagnostic
    update_interval: 60s
    format:
      separator: " "

binary_sensor:
  # Live state of the reed contact, handy for aligning the sensor on the meter
  - platform: gpio
    id: reed_contact
    name: Reed contact
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
      allow_other_uses: true
    # The pulse_meter already owns the pin interrupt
    use_interrupt: false
    entity_category: diagnostic
    filters:
      - delayed_on_off: !lambda return id(reed_debounce).state;
    on_press:
      - lambda: id(led_flash) = true;
      - script.execute: led_refresh
      - delay: 200ms
      - lambda: id(led_flash) = false;
      - script.execute: led_refresh

number:
  # Debounce time of the reed contact: a closed or open contact only counts
  # once it is stable this long. Raise it if a pulse is counted twice.
  - platform: template
    id: reed_debounce
    name: Debounce time
    icon: mdi:timer-cog-outline
    entity_category: config
    unit_of_measurement: ms
    mode: box
    min_value: 10
    max_value: 1000
    step: 10
    initial_value: 100
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(gas_pulse_meter).set_filter_us(x * 1000);

  # Set the current reading shown on the gas meter
  - platform: template
    id: gas_meter_reading_set
    name: Set meter reading
    icon: mdi:counter
    entity_category: config
    unit_of_measurement: "m³"
    mode: box
    min_value: 0
    max_value: 99999.999
    step: 0.001
    update_interval: 60s
    lambda: return id(gas_total_pulses) * id(gas_pulse_volume);
    set_action:
      - lambda: |-
          const uint32_t target = (uint32_t) std::llround(x / id(gas_pulse_volume));
          // Shift the period start values too, so setting the reading
          // does not count as consumption
          const uint32_t delta = target - id(gas_total_pulses);
          id(gas_day_base) += delta;
          id(gas_month_base) += delta;
          id(gas_year_base) += delta;
          id(gas_pulse_meter).set_total_pulses(target);

select:
  # Volume per pulse of the gas meter (last drum digit, one revolution);
  # 0.01 m³ for most gas meters, see the label on the meter
  - platform: template
    id: gas_pulse_volume_select
    name: Pulse volume
    icon: mdi:cog
    entity_category: config
    options:
      - "0.001 m³"
      - "0.01 m³"
      - "0.1 m³"
      - "1 m³"
    update_interval: 60s
    lambda: |-
      char buf[32];
      snprintf(buf, sizeof(buf), "%g m³", id(gas_pulse_volume));
      return std::string(buf);
    set_action:
      - lambda: |-
          const double volume = std::strtod(x.str().c_str(), nullptr);
          if (!(volume > 0) || volume == id(gas_pulse_volume)) return;
          // Convert all pulse counts, so the meter reading and the
          // consumption of the current periods stay the same
          const double factor = id(gas_pulse_volume) / volume;
          auto convert = [factor](uint32_t pulses) { return (uint32_t) std::llround(pulses * factor); };
          id(gas_day_base) = convert(id(gas_day_base));
          id(gas_month_base) = convert(id(gas_month_base));
          id(gas_year_base) = convert(id(gas_year_base));
          id(gas_pulse_volume) = volume;
          id(gas_pulse_meter).set_total_pulses(convert(id(gas_total_pulses)));
      - component.update: gas_pulse_volume_select

  # What the LED shows, see the led_refresh script
  - platform: template
    id: led_mode_select
    name: LED mode
    icon: mdi:led-on
    entity_category: config
    options:
      - "Status + pulse"
      - "Status only"
      - "Off"
    initial_option: "Status + pulse"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: led_refresh

light:
  # Onboard WS2812 RGB LED of the Waveshare ESP32-C3-Zero,
  # controlled by the led_refresh script only
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: LED
    internal: true
    pin: GPIO10
    num_leds: 1
    chipset: WS2812
    channel_colors: RGB
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    id: restart_button
    name: Restart
    entity_category: config
