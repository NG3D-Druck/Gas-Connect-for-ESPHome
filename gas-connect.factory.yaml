packages:
  # Include all of the core configuration
  core: !include esp-gas-connect-bk.yaml

esphome:
  # This will allow for project identification,
  # configuration and updates.
  project:
    name: ng3d.esp-gas-connect-bk
    version: dev  # This will be replaced by the github workflows with the `release` version

# This should point to the public location of the yaml file that will be adopted.
# In this case it is the core yaml file that does not contain the extra things
# that are provided by this factory yaml file as the user does not need these once adopted.
dashboard_import:
  package_import_url: github://NG3D-Druck/Gas-Connect-for-ESPHome/esp-gas-connect-bk.yaml@main

# Sets up Bluetooth LE to allow the user
# to provision wifi credentials to the device.
esp32_improv:
  authorizer: none

# Sets up the improv via serial client for Wi-Fi provisioning
# over the USB-C port of the ESP32-C3-Zero.
improv_serial:

# Used to pull OTA updates
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    id: update_http_request
    name: ${name_firmware}
    source: https://ng3d-druck.github.io/Gas-Connect-for-ESPHome/firmware/esp-gas-connect-bk.manifest.json
